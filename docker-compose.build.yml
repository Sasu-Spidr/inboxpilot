services:
  bao-agent-frontend:
    image: inboxpilot-bao-agent:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent

  bao-agent-worker:
    image: inboxpilot-bao-agent:local

  frontend:
    image: inboxpilot-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"

  mail-agent:
    image: inboxpilot:local
    build:
      context: .
      dockerfile: Dockerfile

  oauth-onboarding:
    image: inboxpilot:local
    ports:
      - "${OAUTH_HOST_PORT:-8080}:8080"
