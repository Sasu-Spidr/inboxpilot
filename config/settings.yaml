groq_api_key: ${GROQ_API_KEY}
groq_model: openai/gpt-oss-120b
polling_interval_seconds: 60
max_emails_per_cycle: 20
token_encryption_key: ${TOKEN_ENCRYPTION_KEY}
state_file: ./data/state/processed_messages.enc
log_level: INFO
json_logs: true

onboarding:
  registry_file: ./data/clients/clients.yaml
  gmail_credentials_file: ./secrets/google-oauth-client.json
  microsoft_client_id_env: MICROSOFT_CLIENT_ID
  microsoft_client_secret_env: MICROSOFT_CLIENT_SECRET

clients:
  exuvie:
    enabled: true
    owner_name: Exuvie
    connectors:
      gmail:
        enabled: true
        accounts:
          - account: main
            sender_name: Exuvie
            credentials_file: ./secrets/google-oauth-client.json
            token_file: ./data/tokens/exuvie-gmail-main.token.enc
      hotmail:
        enabled: true
        accounts:
          - account: main
            client_id_env: MICROSOFT_CLIENT_ID
            client_secret_env: MICROSOFT_CLIENT_SECRET
            tenant_id: consumers
            token_file: ./data/tokens/exuvie-hotmail-main.token.enc
