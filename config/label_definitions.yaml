À répondre:
  priority: 100
  description: "Définition. Un humain identifiable attend une réponse écrite de ma part. Une réponse textuelle réglerait le mail. Inclut les relances, demandes d'information, devis, sollicitations personnelles ou commerciales individuelles."
  action_hint: draft
  examples:
    - "Pouvez-vous me confirmer le devis ?"
    - "Avez-vous eu le temps de regarder ?"
    - "Je me permets de vous relancer"

À traiter:
  priority: 90
  description: "Définition. Le mail exige une action manuelle qui n'est pas une simple réponse : payer, signer, valider un document, gérer un accès ou un compte, effectuer une opération."
  action_hint: keep
  examples:
    - "Facture à régler"
    - "Document à signer"
    - "Accès à valider"

À lire:
  priority: 70
  description: "Définition. Information destinée à un humain, à lire ou conserver, sans action attendue. Regroupe les mises au courant, notes et mentions collaboratives."
  action_hint: keep
  examples:
    - "Pour info"
    - "Note sur un document"
    - "Retour d'un collègue"

Notification:
  priority: 50
  description: "Définition. Message généré par une machine : alerte, code, confirmation transactionnelle, reçu, invitation ou modification de réunion, rappel automatique d'événement."
  action_hint: keep
  examples:
    - "Code à usage unique"
    - "Alerte système"
    - "Invitation calendrier"

Commercial:
  priority: 30
  description: "Définition. Contenu d'abonnement éditorial, promotion, prospection, publicité, offre commerciale, acquisition ou envoi de masse. Au moindre doute, choisir Notification ou À lire."
  action_hint: keep
  examples:
    - "Lettre d'information récurrente"
    - "Promotion"
    - "Cold email commercial"
