name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile main.py gmail_connector.py hotmail_connector.py classifier.py draft_generator.py rules_engine.py token_store.py state_store.py json_logging.py

      - name: Run tests
        run: pytest -q

      - name: Prepare non-secret runtime files for Docker config check
        run: |
          mkdir -p secrets/exuvie data/tokens data/state logs
          python - <<'PY' > .env
          from cryptography.fernet import Fernet
          print("GROQ_API_KEY=dummy")
          print("EXUVIE_MICROSOFT_CLIENT_ID=dummy")
          print(f"TOKEN_ENCRYPTION_KEY={Fernet.generate_key().decode()}")
          PY
          printf '{"installed":{"client_id":"dummy","client_secret":"dummy","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","redirect_uris":["http://localhost"]}}' > secrets/exuvie/gmail-client-secret.json

      - name: Validate Docker Compose
        env:
          BAO_ADDR: https://bao.invalid
          INBOXPILOT_BOOTSTRAP_ROOT: /etc/inboxpilot/test
          IMAGE_TAG: test-sha
          TRAEFIK_BASIC_AUTH_HASH: test-only-placeholder
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  build:
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ghcr.io/${{ github.repository }}
            context: .
            dockerfile: ./Dockerfile
          - name: frontend
            image: ghcr.io/${{ github.repository }}-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: bao-agent
            image: ghcr.io/${{ github.repository }}-bao-agent
            context: .
            dockerfile: ./deploy/Dockerfile.agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=branch

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
