name: Mailbox smoke test

on:
  workflow_dispatch:
    inputs:
      run_once:
        description: Run one Gmail processing cycle after authentication
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Authenticate to OpenBao with GitHub OIDC
        env:
          BAO_ADDR: ${{ vars.BAO_ADDR }}
          INBOXPILOT_ROLE_ID: ${{ vars.INBOXPILOT_ROLE_ID }}
          OIDC_AUDIENCE: https://github.com/Sasu-Spidr/inboxpilot
          RUN_ONCE: ${{ inputs.run_once }}
        run: |
          set -Eeuo pipefail
          test -n "$BAO_ADDR"
          test -n "$INBOXPILOT_ROLE_ID"
          install -d -m 700 .runtime data/tokens data/state data/clients logs

          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"

          jwt_response="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$(jq -cn --arg role inboxpilot-jwt-dev --arg jwt "$oidc_token" \
              '{role:$role,jwt:$jwt}')" \
            "$BAO_ADDR/v1/auth/jwt/login")"
          jwt_token="$(jq -er '.auth.client_token' <<<"$jwt_response")"
          echo "::add-mask::$jwt_token"

          wrapped_response="$(curl --fail --silent --show-error \
            --request POST \
            --header "X-Vault-Token: $jwt_token" \
            --header 'X-Vault-Wrap-TTL: 300s' \
            "$BAO_ADDR/v1/auth/approle/role/inboxpilot-dev/secret-id")"
          wrapping_token="$(jq -er '.wrap_info.token' <<<"$wrapped_response")"
          echo "::add-mask::$wrapping_token"

          unwrap_response="$(curl --fail --silent --show-error \
            --request POST \
            --header "X-Vault-Token: $wrapping_token" \
            "$BAO_ADDR/v1/sys/wrapping/unwrap")"
          secret_id="$(jq -er '.data.secret_id' <<<"$unwrap_response")"
          echo "::add-mask::$secret_id"

          approle_response="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$(jq -cn --arg role_id "$INBOXPILOT_ROLE_ID" --arg secret_id "$secret_id" \
              '{role_id:$role_id,secret_id:$secret_id}')" \
            "$BAO_ADDR/v1/auth/approle/login")"
          bao_token="$(jq -er '.auth.client_token' <<<"$approle_response")"
          echo "::add-mask::$bao_token"
          install -m 600 /dev/null .runtime/bao-token
          printf '%s' "$bao_token" > .runtime/bao-token

          require_field() {
            local path="$1" field="$2"
            curl --fail --silent --show-error \
              --header "X-Vault-Token: $bao_token" \
              "$BAO_ADDR/v1/secret/data/inboxpilot/$path" \
              | jq -e --arg field "$field" \
                '.data.data[$field] as $value
                 | ($value | type) == "string" and ($value | length) > 0' >/dev/null
          }
          require_field crypto token_encryption_key
          require_field groq api_key
          require_field oauth/gmail client_id
          require_field oauth/gmail client_secret
          require_field oauth/microsoft client_id
          require_field oauth/microsoft client_secret

          if [ "$RUN_ONCE" = "true" ]; then
            curl --fail --silent --show-error \
              --header "X-Vault-Token: $bao_token" \
              "$BAO_ADDR/v1/secret/data/inboxpilot/oauth/gmail" \
              | jq -er '.data.data.smoke_gmail_token_enc_b64' \
              | base64 --decode > data/tokens/smoke-gmail-main.token.enc
            chmod 600 data/tokens/smoke-gmail-main.token.enc
            test -s data/tokens/smoke-gmail-main.token.enc

            python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("config/settings.yaml")
          settings = yaml.safe_load(path.read_text(encoding="utf-8"))
          settings["clients"] = {
              "smoke": {
                  "enabled": True,
                  "owner_name": "InboxPilot Smoke",
                  "connectors": {
                      "gmail": {
                          "enabled": True,
                          "accounts": [
                              {
                                  "account": "main",
                                  "token_file": "./data/tokens/smoke-gmail-main.token.enc",
                                  "connected_at": "1970-01-01T00:00:00+00:00",
                                  "reconcile_recent_inbox": False,
                                  "reconcile_processed_messages": False,
                              }
                          ],
                      },
                      "hotmail": {"enabled": False, "accounts": []},
                  },
              }
          }
          path.write_text(
              yaml.safe_dump(settings, allow_unicode=True, sort_keys=False),
              encoding="utf-8",
          )
          PY
          fi

      - name: Run one mailbox cycle through the ephemeral OpenBao proxy
        if: ${{ inputs.run_once }}
        env:
          BAO_ADDR: ${{ vars.BAO_ADDR }}
          BAO_AGENT_ADDR: http://127.0.0.1:8100
        run: |
          set -Eeuo pipefail
          python scripts/openbao_ci_proxy.py \
            --address "$BAO_ADDR" \
            --token-file .runtime/bao-token \
            >.runtime/proxy.log 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8100/healthz >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8100/healthz >/dev/null
          if ! python main.py --once >.runtime/mailbox.log 2>&1; then
            echo "The Gmail smoke cycle failed; logs remain private." >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          events = []
          for line in Path(".runtime/mailbox.log").read_text(encoding="utf-8").splitlines():
              try:
                  events.append(json.loads(line))
              except json.JSONDecodeError:
                  continue

          classified = [event for event in events if event.get("event") == "email_classified"]
          applied = [event for event in events if event.get("event") == "label_applied"]
          failures = [event for event in events if event.get("status") == "failed"]
          if failures:
              raise SystemExit("The Gmail smoke cycle reported an application failure.")
          if not classified or not applied:
              raise SystemExit(
                  "No unread test email was both classified and labelled. "
                  "Prepare one unread message in the dedicated smoke mailbox and retry."
              )
          print(f"Gmail smoke succeeded: {len(applied)} unread message(s) labelled.")
          PY

      - name: Remove ephemeral authentication material
        if: always()
        run: rm -rf .runtime data/tokens data/state data/clients
