name: Classification evaluation

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: classification-eval-dev
  cancel-in-progress: false

jobs:
  live-evaluation:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to OpenBao with GitHub OIDC
        uses: ./.github/actions/openbao-ci-auth
        with:
          bao_addr: ${{ vars.BAO_ADDR }}
          role_id: ${{ vars.INBOXPILOT_ROLE_ID }}

      - name: Start the loopback OpenBao proxy
        env:
          BAO_ADDR: ${{ vars.BAO_ADDR }}
        run: |
          set -Eeuo pipefail
          python scripts/openbao_ci_proxy.py \
            --address "$BAO_ADDR" \
            --token-file .runtime/bao-token \
            >.runtime/proxy.log 2>&1 &
          echo "$!" > .runtime/proxy.pid
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8100/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "The local OpenBao proxy did not become ready." >&2
          exit 1

      - name: Run the live evaluation
        env:
          BAO_AGENT_ADDR: http://127.0.0.1:8100
        run: |
          python evals/run_eval.py \
            --output-dir eval-output/report \
            --record eval-output/recordings

      - name: Compare with the reviewed baseline
        run: python evals/compare_reports.py eval-output/report/report.json

      - name: Add the Markdown report to the run summary
        if: always()
        run: |
          if [ -s eval-output/report/report.md ]; then
            cat eval-output/report/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# InboxPilot evaluation failed before producing a report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the machine-readable report and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classification-eval-${{ github.run_id }}
          path: eval-output/
          if-no-files-found: warn
          retention-days: 30

      - name: Notify the team with a GitHub issue
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = '[InboxPilot] Régression ou panne de l’évaluation nocturne';
            const body = [
              'L’évaluation réelle du classement a échoué.',
              '',
              `Run : ${process.env.RUN_URL}`,
              '',
              'Consultez le résumé Markdown et l’artefact JSON avant de modifier la référence.'
            ].join('\n');
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const issue = existing.find(item => item.title === title && !item.pull_request);
            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Remove ephemeral OpenBao authentication material
        if: always()
        run: |
          if [ -s .runtime/proxy.pid ]; then
            kill "$(cat .runtime/proxy.pid)" 2>/dev/null || true
          fi
          rm -rf .runtime
