name: Publish and deploy images

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        default: all
        type: choice
        options:
          - dev
          - prod
          - all

permissions:
  contents: read
  packages: write

concurrency:
  group: inboxpilot-image-deployment
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/sasu-spidr/inboxpilot
  FRONTEND_IMAGE: ghcr.io/sasu-spidr/inboxpilot-frontend
  BAO_AGENT_IMAGE: ghcr.io/sasu-spidr/inboxpilot-bao-agent

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=inboxpilot-backend
          cache-to: type=gha,mode=max,scope=inboxpilot-backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=inboxpilot-frontend
          cache-to: type=gha,mode=max,scope=inboxpilot-frontend

      - name: Build and push OpenBao agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.agent
          push: true
          tags: ${{ env.BAO_AGENT_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=bao-agent
          cache-to: type=gha,mode=max,scope=bao-agent

  deploy-dev:
    needs: publish
    if: inputs.target == 'dev' || inputs.target == 'all'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure pinned SSH access
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy dev
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
          OAUTH_BASE_URL: ${{ vars.OAUTH_BASE_URL }}
          OAUTH_PUBLIC_URL: ${{ vars.OAUTH_PUBLIC_URL }}
          BAO_ADDR: ${{ vars.BAO_ADDR }}
        run: sh scripts/deploy_remote_images.sh dev

  deploy-prod:
    needs: [publish, deploy-dev]
    if: >-
      always() && needs.publish.result == 'success' &&
      (inputs.target == 'prod' ||
      (inputs.target == 'all' && needs.deploy-dev.result == 'success'))
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure pinned SSH access
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy prod
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
          OAUTH_BASE_URL: ${{ vars.OAUTH_BASE_URL }}
          OAUTH_PUBLIC_URL: ${{ vars.OAUTH_PUBLIC_URL }}
          BAO_ADDR: ${{ vars.BAO_ADDR }}
        run: sh scripts/deploy_remote_images.sh prod
