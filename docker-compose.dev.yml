services:
  frontend:
    image: ghcr.io/sasu-spidr/inboxpilot-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    networks:
      - default
      - chatmallow_edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=chatmallow_edge"
      - "traefik.http.routers.inboxpilot-dev.rule=Host(`inboxpilot-dev.mallow-hub.tech`)"
      - "traefik.http.routers.inboxpilot-dev.entrypoints=websecure"
      - "traefik.http.routers.inboxpilot-dev.tls=true"
      - "traefik.http.routers.inboxpilot-dev.tls.certresolver=le"
      - "traefik.http.routers.inboxpilot-dev.middlewares=inboxpilot-dev-auth"
      - "traefik.http.middlewares.inboxpilot-dev-auth.basicauth.users=${TRAEFIK_BASIC_AUTH_HASH:?TRAEFIK_BASIC_AUTH_HASH is required}"
      - "traefik.http.services.inboxpilot-dev.loadbalancer.server.port=3000"

  mail-agent:
    image: ghcr.io/sasu-spidr/inboxpilot:${IMAGE_TAG:?IMAGE_TAG is required}

  oauth-onboarding:
    image: ghcr.io/sasu-spidr/inboxpilot:${IMAGE_TAG:?IMAGE_TAG is required}

networks:
  chatmallow_edge:
    external: true
