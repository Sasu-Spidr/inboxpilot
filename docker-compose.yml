services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spidr_mail}
      POSTGRES_USER: ${POSTGRES_USER:-spidr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spidr_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spidr} -d ${POSTGRES_DB:-spidr_mail}"]
      interval: 10s
      timeout: 5s
      retries: 5
  bao-agent-frontend:
    image: ghcr.io/sasu-spidr/inboxpilot-bao-agent:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["agent", "-config=/etc/bao/agent.hcl"]
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      BAO_ADDR: ${BAO_ADDR:?BAO_ADDR is required}
      BAO_SKIP_DROP_ROOT: "1"
    volumes:
      - type: bind
        source: ${INBOXPILOT_BOOTSTRAP_ROOT:-/etc/inboxpilot/dev}/frontend
        target: /bootstrap
        read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700
    networks:
      - bao_frontend
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8100/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  bao-agent-worker:
    image: ghcr.io/sasu-spidr/inboxpilot-bao-agent:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["agent", "-config=/etc/bao/agent.hcl"]
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      BAO_ADDR: ${BAO_ADDR:?BAO_ADDR is required}
      BAO_SKIP_DROP_ROOT: "1"
    volumes:
      - type: bind
        source: ${INBOXPILOT_BOOTSTRAP_ROOT:-/etc/inboxpilot/dev}/worker
        target: /bootstrap
        read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700
    networks:
      - bao_worker
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8100/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  frontend:
    image: ghcr.io/sasu-spidr/inboxpilot-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://spidr:spidr_dev_password@postgres:5432/spidr_mail}
      DATA_DIR: /data
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      OAUTH_PUBLIC_URL: ${OAUTH_PUBLIC_URL:-}
      OAUTH_INTERNAL_URL: ${OAUTH_INTERNAL_URL:-http://oauth-onboarding:8080}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
    volumes:
      - inboxpilot_data:/data
    networks:
      - default
      - bao_frontend
    depends_on:
      postgres:
        condition: service_healthy
      oauth-onboarding:
        condition: service_healthy
      bao-agent-frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  mail-agent:
    image: ghcr.io/sasu-spidr/inboxpilot:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      BAO_AGENT_ADDR: ${BAO_AGENT_ADDR:-http://bao-agent-worker:8100}
      DATA_DIR: /app/data
      CALENDAR_SYNC_ENABLED: ${CALENDAR_SYNC_ENABLED:-true}
      CALENDAR_SYNC_RUN_HOUR: ${CALENDAR_SYNC_RUN_HOUR:-0}
      CALENDAR_SYNC_DAYS: ${CALENDAR_SYNC_DAYS:-1}
      CALENDAR_SYNC_TIMEZONE: ${CALENDAR_SYNC_TIMEZONE:-Europe/Paris}
    volumes:
      - inboxpilot_data:/app/data
      - inboxpilot_logs:/app/logs
    networks:
      - default
      - bao_worker
    depends_on:
      bao-agent-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; raise SystemExit(0 if Path('/app/config/settings.yaml').exists() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  oauth-onboarding:
    image: ghcr.io/sasu-spidr/inboxpilot:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["python", "oauth_server.py"]
    environment:
      BAO_AGENT_ADDR: ${BAO_AGENT_ADDR:-http://bao-agent-worker:8100}
      DATA_DIR: /app/data
      OAUTH_BASE_URL: ${OAUTH_BASE_URL:-http://localhost:8080}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      OAUTH_PORT: 8080
    volumes:
      - inboxpilot_data:/app/data
      - inboxpilot_logs:/app/logs
    networks:
      - default
      - bao_worker
    depends_on:
      bao-agent-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  inboxpilot_data:
  inboxpilot_logs:

networks:
  bao_frontend:
  bao_worker:
